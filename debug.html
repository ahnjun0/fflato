<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PLATO 빠른 출결 - Debug</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 13px;
      color: #333;
      background: #f5f5f5;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 4px;
      color: #1a3a5c;
    }
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .card-header {
      background: #f8f8f8;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 13px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-body { padding: 12px 14px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-green { background: #d4edda; color: #155724; }
    .badge-red { background: #f8d7da; color: #721c24; }
    .badge-gray { background: #e9ecef; color: #495057; }
    .badge-blue { background: #cce5ff; color: #004085; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      padding: 6px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      font-weight: 600;
      color: #666;
      font-size: 11px;
      text-transform: uppercase;
    }
    td a {
      color: #1a3a5c;
      text-decoration: none;
    }
    td a:hover { text-decoration: underline; }

    .log-area {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 12px;
      border-radius: 6px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.6;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-time { color: #6a9955; }
    .log-tag { color: #569cd6; }
    .log-error { color: #f44747; }

    .btn {
      padding: 6px 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      color: #333;
    }
    .btn:hover { background: #f0f0f0; }
    .btn-primary {
      background: #1a3a5c;
      color: #fff;
      border-color: #1a3a5c;
    }
    .btn-primary:hover { background: #244d75; }

    .step-tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
    }
    .step-active { background: #d4edda; color: #155724; }
    .step-skip { background: #e9ecef; color: #666; }
    .step-attended { background: #fff3cd; color: #856404; }
    .step-error { background: #f8d7da; color: #721c24; }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <h1>PLATO 빠른 출결 - Debug</h1>
  <p class="subtitle">출결 스캔 과정을 상세히 확인할 수 있습니다.</p>

  <div class="toolbar">
    <button class="btn btn-primary" id="btn-scan">스캔 실행</button>
    <button class="btn" id="btn-clear-log">로그 지우기</button>
  </div>

  <!-- 실시간 로그 -->
  <div class="card">
    <div class="card-header">실시간 로그</div>
    <div class="card-body">
      <div class="log-area" id="log-area">스캔을 실행하면 여기에 로그가 표시됩니다.<br></div>
    </div>
  </div>

  <!-- 과목 목록 -->
  <div class="card" id="courses-card" style="display:none">
    <div class="card-header">
      수강 과목 목록
      <span class="badge badge-gray" id="courses-count"></span>
    </div>
    <div class="card-body" id="courses-body"></div>
  </div>

  <!-- 스캔 상세 결과 -->
  <div class="card" id="detail-card" style="display:none">
    <div class="card-header">
      과목별 스캔 상세
      <span class="badge badge-gray" id="detail-count"></span>
    </div>
    <div class="card-body" id="detail-body"></div>
  </div>

  <!-- 활성 세션 -->
  <div class="card" id="active-card" style="display:none">
    <div class="card-header">
      활성 출결 세션
      <span class="badge badge-green" id="active-count"></span>
    </div>
    <div class="card-body" id="active-body"></div>
  </div>

  <!-- 결석 현황 -->
  <div class="card" id="absence-card" style="display:none">
    <div class="card-header">
      결석 현황
      <span class="badge badge-red" id="absence-count"></span>
    </div>
    <div class="card-body" id="absence-body"></div>
  </div>

  <script src="plato-api.js"></script>
  <script src="debug.js"></script>
</body>
</html>
